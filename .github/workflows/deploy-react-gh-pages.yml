# .github/workflows/deploy-react-gh-pages.yml
name: Build and deploy React app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write    # allows reading and writing repo files, e.g., gh-pages branch
  pages: write       # required to deploy GitHub Pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages (JamesIves action)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages             # The branch the action will push to
          folder: build                # The folder with your build output
          clean: true
